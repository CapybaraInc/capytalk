<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔥 MESSENGER X</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0D1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .app {
      width: 100%;
      max-width: 420px;
      height: 780px;
      background: #0D1117;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      position: relative;
    }
    .header {
      background: #161B22;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .logo { color: #E6EDF3; font-size: 18px; font-weight: 700; }
    .logo span { color: #2EA043; }
    .header-actions { display: flex; gap: 12px; color: #8B949E; font-size: 18px; cursor: pointer; }
    .header-actions span:hover { color: #E6EDF3; }
    .tabs {
      display: flex;
      background: #0D1117;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      color: #8B949E;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
    }
    .tab:hover { color: #E6EDF3; }
    .tab.active { color: #2EA043; border-bottom-color: #2EA043; }
    .tab-content { flex: 1; overflow: hidden; position: relative; }
    .tab-pane {
      display: none;
      height: 100%;
      flex-direction: column;
      overflow-y: auto;
    }
    .tab-pane.active { display: flex; }
    .tab-pane::-webkit-scrollbar { width: 4px; }
    .tab-pane::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }

    .chat-header {
      padding: 10px 16px;
      background: #0D1117;
      border-bottom: 1px solid #1F2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .chat-back { color: #8B949E; cursor: pointer; font-size: 14px; }
    .chat-back:hover { color: #E6EDF3; }
    .chat-clear { background: #DA3633; border: none; color: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.friend { background: #1F2937; color: #E6EDF3; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.me { background: #2EA043; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg .time { font-size: 10px; color: #8B949E; margin-top: 4px; display: block; }
    .msg.me .time { color: rgba(255,255,255,0.6); }
    .chat-input {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #161B22;
      flex-shrink: 0;
    }
    .chat-input input {
      flex: 1;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 10px 16px;
      color: #E6EDF3;
      font-size: 14px;
      outline: none;
    }
    .chat-input input:focus { border-color: #2EA043; }
    .chat-input button {
      background: #2EA043;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .chat-input button:hover { background: #3FB950; }
    .contacts-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .contact-item {
      background: #161B22;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: 1px solid #1F2937;
      transition: 0.2s;
    }
    .contact-item:hover { border-color: #2EA043; }
    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1F2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #E6EDF3;
      position: relative;
      flex-shrink: 0;
    }
    .contact-avatar .dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #161B22;
    }
    .contact-avatar .dot.online { background: #3FB950; }
    .contact-avatar .dot.offline { background: #DA3633; }
    .contact-info { flex: 1; }
    .contact-name { font-weight: 600; color: #E6EDF3; }
    .contact-status { font-size: 12px; color: #8B949E; }
    .contact-delete {
      color: #8B949E;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
    }
    .contact-delete:hover { background: #DA3633; color: #fff; }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8B949E;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .empty-state .icon { font-size: 56px; }
    .empty-state .title { font-size: 18px; font-weight: 600; color: #E6EDF3; }
    .empty-state .sub { font-size: 14px; }
    .empty-state .id-box { background: #161B22; padding: 8px 16px; border-radius: 8px; font-size: 13px; }
    .empty-state .id-box strong { color: #2EA043; }
    .add-contact-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #161B22;
      border-top: 1px solid #1F2937;
      flex-shrink: 0;
    }
    .add-contact-row input {
      flex: 1;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 10px;
      padding: 10px 14px;
      color: #E6EDF3;
      font-size: 14px;
      outline: none;
    }
    .add-contact-row input:focus { border-color: #2EA043; }
    .add-contact-row button {
      background: #2EA043;
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .add-contact-row button:hover { background: #3FB950; }
    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px;
    }
    .game-card {
      background: #161B22;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      border: 1px solid #1F2937;
      transition: 0.2s;
    }
    .game-card:hover { border-color: #2EA043; transform: scale(1.02); }
    .game-card .icon { font-size: 32px; }
    .game-card .name { color: #E6EDF3; font-size: 13px; font-weight: 600; margin-top: 4px; }
    .game-card .desc { color: #8B949E; font-size: 11px; }
    .add-game-btn {
      background: #161B22;
      border: 2px dashed #2EA043;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #2EA043;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      grid-column: 1 / -1;
    }
    .add-game-btn:hover { background: #1F2937; }
    .game-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      justify-content: center;
    }
    .game-actions button {
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .game-actions .edit { background: #1F6FEB; color: #fff; }
    .game-actions .edit:hover { background: #388BFD; }
    .game-actions .delete { background: #DA3633; color: #fff; }
    .game-actions .delete:hover { background: #F85149; }
    .console-area {
      padding: 12px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .console-area textarea {
      flex: 1;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 12px;
      padding: 12px;
      color: #E6EDF3;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 150px;
    }
    .console-area textarea:focus { border-color: #2EA043; }
    .console-area textarea::placeholder { color: #8B949E; }
    .console-actions {
      display: flex;
      gap: 10px;
    }
    .console-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-run { background: #2EA043; color: #fff; }
    .btn-run:hover { background: #3FB950; }
    .btn-publish { background: #1F6FEB; color: #fff; }
    .btn-publish:hover { background: #388BFD; }
    .console-output {
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 12px;
      padding: 10px 14px;
      color: #8B949E;
      font-size: 13px;
      min-height: 50px;
      max-height: 100px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
    }
    .game-player {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0D1117;
      z-index: 100;
      flex-direction: column;
    }
    .game-player.active { display: flex; }
    .game-player .close-btn {
      background: #DA3633;
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      align-self: flex-end;
      margin: 12px 16px;
    }
    .game-player .close-btn:hover { background: #F85149; }
    .game-player .game-frame {
      flex: 1;
      margin: 0 16px 16px;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    .game-player .game-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .game-form {
      background: #161B22;
      border-radius: 12px;
      padding: 16px;
      margin: 0 16px 12px;
      border: 1px solid #1F2937;
    }
    .game-form input, .game-form textarea {
      width: 100%;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 8px;
      padding: 10px 14px;
      color: #E6EDF3;
      font-size: 14px;
      outline: none;
      margin-bottom: 8px;
      font-family: 'Segoe UI', sans-serif;
    }
    .game-form input:focus, .game-form textarea:focus { border-color: #2EA043; }
    .game-form textarea { resize: vertical; min-height: 60px; }
    .game-form .form-actions {
      display: flex;
      gap: 8px;
    }
    .game-form .form-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-create { background: #2EA043; color: #fff; }
    .btn-create:hover { background: #3FB950; }
    .btn-cancel { background: #1F2937; color: #8B949E; }
    .btn-cancel:hover { background: #DA3633; color: #fff; }

    /* Индикатор печатает */
    #typingIndicator {
      font-size: 12px;
      color: #8B949E;
      padding: 4px 16px 0 16px;
      min-height: 20px;
      display: none;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <div class="logo">MESSENGER <span>X</span></div>
    <div class="header-actions">
      <span id="copyIdBtn" title="Мой ID">📋</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="contacts">👥 Контакты</div>
    <div class="tab" data-tab="games">🎮 Игры</div>
    <div class="tab" data-tab="console">🛠️ Консоль</div>
  </div>

  <div class="tab-content">
    <div class="tab-pane active" id="tab-contacts">
      <div class="contacts-list" id="contactsList"></div>
      <div class="add-contact-row">
        <input id="addFriendInput" placeholder="Введите ID друга...">
        <button id="addFriendBtn">➕ Добавить</button>
      </div>
    </div>

    <div class="tab-pane" id="tab-games">
      <div style="padding: 8px 16px 4px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="createGameBtn" style="background:#2EA043;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">➕ Создать игру</button>
        <button id="deleteAllGamesBtn" style="background:#DA3633;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">🗑️ Удалить всё</button>
      </div>
      <div id="gameFormContainer"></div>
      <div class="games-grid" id="gamesGrid"></div>
    </div>

    <div class="tab-pane" id="tab-console">
      <div class="console-area">
        <textarea id="codeEditor" placeholder="// Напиши код игры на JavaScript...&#10;// Обязательно добавь функцию startGame()">// Пример игры
function startGame() {
  alert('🎮 Привет! Это твоя игра!');
}</textarea>
        <div class="console-actions">
          <button id="runCodeBtn" class="btn-run">▶️ Запустить</button>
          <button id="publishCodeBtn" class="btn-publish">📤 Опубликовать</button>
        </div>
        <div class="console-output" id="consoleOutput">✅ Готов к работе</div>
      </div>
    </div>
  </div>

  <div class="game-player" id="gamePlayer">
    <button class="close-btn" id="closeGameBtn">✕ Закрыть</button>
    <div class="game-frame" id="gameFrame">
      <div id="gamePlaceholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:#8B949E;font-size:16px;flex-direction:column;gap:12px;">
        <span style="font-size:48px;">🎮</span>
        <span>Выбери игру из списка</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  //  🔥 MESSENGER X — СТАТУСЫ: ОНЛАЙН, ОФЛАЙН, ПЕЧАТАЕТ
  // ============================================================

  console.log('🚀 Загрузка MESSENGER X...');

  // --- ID ---
  let myId = localStorage.getItem('messengerMyId');
  if (!myId) {
    myId = 'USER_' + Math.random().toString(36).substring(2, 7).toUpperCase();
    localStorage.setItem('messengerMyId', myId);
  }
  console.log('📋 Ваш ID:', myId);

  // --- Данные ---
  let contacts = JSON.parse(localStorage.getItem('messengerContacts') || '[]');
  let currentChat = localStorage.getItem('messengerCurrentChat') || null;
  let messages = JSON.parse(localStorage.getItem('messengerMessages') || '{}');
  let games = JSON.parse(localStorage.getItem('devGames') || '[]');

  // --- DOM ---
  const contactsList = document.getElementById('contactsList');
  const gamesGrid = document.getElementById('gamesGrid');
  const gameFormContainer = document.getElementById('gameFormContainer');
  const consoleOutput = document.getElementById('consoleOutput');
  const codeEditor = document.getElementById('codeEditor');

  // ============================================================
  //  СОХРАНЕНИЕ ВРЕМЕНИ (ДЛЯ ОНЛАЙН СТАТУСА)
  // ============================================================
  setInterval(() => {
    localStorage.setItem('lastSeen_' + myId, String(Date.now()));
  }, 5000);

  // ============================================================
  //  ФУНКЦИЯ ОНЛАЙН СТАТУСА
  // ============================================================
  function isUserOnline(id) {
    const lastSeen = localStorage.getItem('lastSeen_' + id);
    if (!lastSeen) return false;
    const diff = Date.now() - parseInt(lastSeen);
    return diff < 10000; // 10 секунд — считается онлайн
  }

  // ============================================================
  //  РЕНДЕРИНГ КОНТАКТОВ (С ОНЛАЙН/ОФЛАЙН)
  // ============================================================
  function renderContacts() {
    if (!contactsList) return;

    if (contacts.length === 0) {
      contactsList.innerHTML = `
        <div class="empty-state">
          <div class="icon">👥</div>
          <div class="title">Нет контактов</div>
          <div class="sub">Добавь друга по ID</div>
          <div class="id-box">Ваш ID: <strong>${myId}</strong></div>
        </div>
      `;
      return;
    }

    let html = '';
    contacts.forEach(id => {
      const online = isUserOnline(id);
      const statusText = online ? '🟢 онлайн' : '🔴 офлайн';

      html += `
        <div class="contact-item" data-contact="${id}">
          <div class="contact-avatar">
            ${id.charAt(0)}
            <span class="dot ${online ? 'online' : 'offline'}"></span>
          </div>
          <div class="contact-info">
            <div class="contact-name">${id}</div>
            <div class="contact-status">${statusText}</div>
          </div>
          <span class="contact-delete" data-contact="${id}">✕</span>
        </div>
      `;
    });

    contactsList.innerHTML = html;

    // События
    contactsList.querySelectorAll('.contact-item').forEach(item => {
      item.addEventListener('click', function(e) {
        if (e.target.classList.contains('contact-delete')) return;
        const id = this.dataset.contact;
        openChat(id);
      });
    });

    contactsList.querySelectorAll('.contact-delete').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = this.dataset.contact;
        if (!confirm(`Удалить контакт ${id}?`)) return;
        contacts = contacts.filter(c => c !== id);
        localStorage.setItem('messengerContacts', JSON.stringify(contacts));
        if (currentChat === id) {
          currentChat = null;
          localStorage.removeItem('messengerCurrentChat');
        }
        renderContacts();
      });
    });
  }

  // ============================================================
  //  ДОБАВЛЕНИЕ КОНТАКТА
  // ============================================================
  function addContact() {
    const input = document.getElementById('addFriendInput');
    const id = input.value.trim().toUpperCase();
    if (!id) { alert('❌ Введите ID друга'); return; }
    if (id === myId) { alert('❌ Это ваш ID!'); return; }
    if (contacts.includes(id)) { alert('❌ Уже добавлен'); return; }
    contacts.push(id);
    localStorage.setItem('messengerContacts', JSON.stringify(contacts));
    input.value = '';
    renderContacts();
  }

  document.getElementById('addFriendBtn').addEventListener('click', addContact);
  document.getElementById('addFriendInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addContact();
  });

  // ============================================================
  //  КОПИРОВАНИЕ ID
  // ============================================================
  document.getElementById('copyIdBtn').addEventListener('click', function() {
    navigator.clipboard?.writeText(myId)?.then(() => {
      alert('✅ ID скопирован:\n' + myId);
    })?.catch(() => {
      prompt('Ваш ID:', myId);
    });
  });

  // ============================================================
  //  ЧАТ С "ПЕЧАТАЕТ..."
  // ============================================================
  let typingTimeout;

  function openChat(id) {
    currentChat = id;
    localStorage.setItem('messengerCurrentChat', id);
    renderChat();
  }

  function renderChat() {
    if (!contactsList) return;
    const msgs = messages[currentChat] || [];

    let html = `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div class="chat-header">
          <span class="chat-back" id="chatBackBtn">← Назад к контактам</span>
          <span style="font-weight:600;color:#E6EDF3;">${currentChat}</span>
          <button class="chat-clear" id="clearChatBtn">🗑️ Очистить</button>
        </div>
        <div class="chat-messages" id="chatMessagesArea">
    `;

    if (msgs.length === 0) {
      html += `<div style="text-align:center;color:#8B949E;padding:30px 0;">💬 Нет сообщений<br><span style="font-size:12px;">Напиши что-нибудь...</span></div>`;
    } else {
      msgs.forEach(msg => {
        const isMe = msg.from === myId;
        html += `
          <div class="msg ${isMe ? 'me' : 'friend'}">
            ${msg.text}
            <span class="time">${msg.time || 'Только что'}</span>
          </div>
        `;
      });
    }

    html += `
        </div>
        <div id="typingIndicator">✍️ <span id="typingName">${currentChat}</span> печатает...</div>
        <div class="chat-input">
          <input id="chatInput" placeholder="Сообщение...">
          <button id="sendMsgBtn">➤</button>
        </div>
      </div>
    `;

    contactsList.innerHTML = html;

    // Назад
    document.getElementById('chatBackBtn').addEventListener('click', function() {
      currentChat = null;
      localStorage.removeItem('messengerCurrentChat');
      renderContacts();
    });

    // Очистить
    document.getElementById('clearChatBtn').addEventListener('click', function() {
      if (!confirm('Удалить всю переписку?')) return;
      delete messages[currentChat];
      localStorage.setItem('messengerMessages', JSON.stringify(messages));
      renderChat();
    });

    // Отправка
    document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // 🟢 "Печатает..."
    chatInput.addEventListener('input', function() {
      const indicator = document.getElementById('typingIndicator');
      if (this.value.length > 0) {
        indicator.style.display = 'block';
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          indicator.style.display = 'none';
        }, 2000);
      } else {
        indicator.style.display = 'none';
      }
    });

    const area = document.getElementById('chatMessagesArea');
    if (area) area.scrollTop = area.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentChat) return;

    if (!messages[currentChat]) messages[currentChat] = [];
    messages[currentChat].push({
      from: myId,
      text: text,
      time: new Date().toLocaleTimeString()
    });
    localStorage.setItem('messengerMessages', JSON.stringify(messages));
    input.value = '';

    // Скрываем "печатает..."
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.style.display = 'none';

    renderChat();
  }

  // ============================================================
  //  ВКЛАДКИ
  // ============================================================
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      const name = this.dataset.tab;
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      this.classList.add('active');
      if (name === 'contacts') renderContacts();
      if (name === 'games') renderGames();
    });
  });

  // ============================================================
  //  ИГРЫ
  // ============================================================
  function renderGames() {
    if (!gamesGrid) return;
    if (games.length === 0) {
      gamesGrid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;color:#8B949E;padding:30px 0;">
          🎮 Нет игр<br>
          <span style="font-size:12px;">Создай игру через Консоль или кнопку ниже</span>
        </div>
        <div class="add-game-btn" id="addGameBtn">➕ Добавить свою игру</div>
      `;
      document.getElementById('addGameBtn')?.addEventListener('click', showCreateGameForm);
      return;
    }

    let html = '';
    games.forEach((game, index) => {
      html += `
        <div class="game-card" data-index="${index}">
          <div class="icon">${game.icon || '🎮'}</div>
          <div class="name">${game.name || 'Без названия'}</div>
          <div class="desc">${game.description || ''}</div>
          <div class="game-actions">
            <button class="edit" data-index="${index}">✏️</button>
            <button class="delete" data-index="${index}">🗑️</button>
          </div>
        </div>
      `;
    });
    html += `<div class="add-game-btn" id="addGameBtn">➕ Добавить свою игру</div>`;
    gamesGrid.innerHTML = html;

    gamesGrid.querySelectorAll('.game-card').forEach(card => {
      const index = parseInt(card.dataset.index);
      card.addEventListener('click', function(e) {
        if (e.target.closest('.game-actions')) return;
        playGame(index);
      });
    });

    gamesGrid.querySelectorAll('.game-actions .edit').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const index = parseInt(this.dataset.index);
        editGame(index);
      });
    });

    gamesGrid.querySelectorAll('.game-actions .delete').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const index = parseInt(this.dataset.index);
        if (!confirm(`Удалить игру "${games[index].name}"?`)) return;
        games.splice(index, 1);
        localStorage.setItem('devGames', JSON.stringify(games));
        renderGames();
      });
    });

    document.getElementById('addGameBtn')?.addEventListener('click', showCreateGameForm);
  }

  function showCreateGameForm() {
    gameFormContainer.innerHTML = `
      <div class="game-form">
        <input id="gameNameInput" placeholder="Название игры...">
        <input id="gameIconInput" placeholder="Иконка (эмодзи)" value="🎮">
        <textarea id="gameDescInput" placeholder="Описание игры..."></textarea>
        <div class="form-actions">
          <button class="btn-create" id="createGameSubmit">✅ Создать</button>
          <button class="btn-cancel" id="createGameCancel">Отмена</button>
        </div>
      </div>
    `;
    document.getElementById('createGameSubmit').addEventListener('click', createGame);
    document.getElementById('createGameCancel').addEventListener('click', () => gameFormContainer.innerHTML = '');
  }

  function createGame() {
    const name = document.getElementById('gameNameInput').value.trim() || 'Новая игра';
    const icon = document.getElementById('gameIconInput').value.trim() || '🎮';
    const description = document.getElementById('gameDescInput').value.trim() || 'Игра от пользователя';
    const code = localStorage.getItem('currentGameCode') || 'function startGame() { alert("🎮 Привет!"); }';
    games.push({ name, icon, description, code });
    localStorage.setItem('devGames', JSON.stringify(games));
    gameFormContainer.innerHTML = '';
    renderGames();
  }

  function editGame(index) {
    const game = games[index];
    gameFormContainer.innerHTML = `
      <div class="game-form">
        <input id="gameNameInput" placeholder="Название игры..." value="${game.name || ''}">
        <input id="gameIconInput" placeholder="Иконка" value="${game.icon || '🎮'}">
        <textarea id="gameDescInput" placeholder="Описание...">${game.description || ''}</textarea>
        <div class="form-actions">
          <button class="btn-create" id="updateGameSubmit">💾 Обновить</button>
          <button class="btn-cancel" id="updateGameCancel">Отмена</button>
        </div>
      </div>
    `;
    document.getElementById('updateGameSubmit').addEventListener('click', function() {
      games[index].name = document.getElementById('gameNameInput').value.trim() || 'Новая игра';
      games[index].icon = document.getElementById('gameIconInput').value.trim() || '🎮';
      games[index].description = document.getElementById('gameDescInput').value.trim() || 'Игра от пользователя';
      localStorage.setItem('devGames', JSON.stringify(games));
      gameFormContainer.innerHTML = '';
      renderGames();
    });
    document.getElementById('updateGameCancel').addEventListener('click', () => gameFormContainer.innerHTML = '');
  }

  function playGame(index) {
    const game = games[index];
    if (!game) return;
    const player = document.getElementById('gamePlayer');
    const frame = document.getElementById('gameFrame');
    const placeholder = document.getElementById('gamePlaceholder');
    player.classList.add('active');
    placeholder.style.display = 'none';
    frame.innerHTML = '';

    const container = document.createElement('div');
    container.style.cssText = 'width:100%;height:100%;background:#0D1117;padding:16px;overflow-y:auto;font-family:Segoe UI,sans-serif;box-sizing:border-box;';
    container.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:32px;">${game.icon || '🎮'}</span>
          <span style="font-size:18px;font-weight:700;color:#E6EDF3;">${game.name}</span>
        </div>
      </div>
      <div style="color:#8B949E;font-size:13px;margin-bottom:12px;">${game.description || 'Нет описания'}</div>
      <div id="gameContent" style="background:#161B22;border-radius:12px;padding:16px;min-height:150px;border:1px solid #1F2937;color:#E6EDF3;">
        <span style="color:#8B949E;">⏳ Загрузка игры...</span>
      </div>
    `;
    frame.appendChild(container);

    if (game.code) {
      try {
        const fn = new Function(game.code + '\n return startGame;');
        const startGameFn = fn();
        if (typeof startGameFn === 'function') {
          startGameFn();
        } else {
          document.getElementById('gameContent').innerHTML = `<div style="color:#DA3633;">❌ Ошибка: функция startGame() не найдена</div>`;
        }
      } catch(e) {
        document.getElementById('gameContent').innerHTML = `<div style="color:#DA3633;">❌ Ошибка: ${e.message}</div>`;
      }
    }
  }

  document.getElementById('closeGameBtn').addEventListener('click', function() {
    document.getElementById('gamePlayer').classList.remove('active');
    document.getElementById('gameFrame').innerHTML = `
      <div id="gamePlaceholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:#8B949E;font-size:16px;flex-direction:column;gap:12px;">
        <span style="font-size:48px;">🎮</span>
        <span>Выбери игру из списка</span>
      </div>
    `;
  });

  document.getElementById('createGameBtn')?.addEventListener('click', showCreateGameForm);
  document.getElementById('deleteAllGamesBtn')?.addEventListener('click', function() {
    if (confirm('Удалить все игры?')) {
      games = [];
      localStorage.setItem('devGames', JSON.stringify(games));
      renderGames();
    }
  });

  // ============================================================
  //  КОНСОЛЬ
  // ============================================================
  document.getElementById('runCodeBtn').addEventListener('click', function() {
    const code = codeEditor.value;
    try {
      const fn = new Function(code + '\n return startGame;');
      const startGameFn = fn();
      if (typeof startGameFn === 'function') {
        startGameFn();
        consoleOutput.innerHTML = '✅ Игра выполнена!';
      } else {
        consoleOutput.innerHTML = '❌ Функция startGame() не найдена';
      }
    } catch(e) {
      consoleOutput.innerHTML = '❌ Ошибка: ' + e.message;
    }
  });

  document.getElementById('publishCodeBtn').addEventListener('click', function() {
    const code = codeEditor.value;
    if (!code.includes('function startGame')) {
      consoleOutput.innerHTML = '❌ Добавь функцию startGame() в код!';
      return;
    }
    localStorage.setItem('currentGameCode', code);
    const name = prompt('Название игры:', 'Моя игра');
    if (!name) return;
    const icon = prompt('Иконка (эмодзи):', '🎮') || '🎮';
    const description = prompt('Описание:', 'Игра от пользователя') || 'Игра от пользователя';
    games.push({ name, icon, description, code });
    localStorage.setItem('devGames', JSON.stringify(games));
    consoleOutput.innerHTML = '✅ Игра опубликована! Перейди во вкладку "Игры"';
    renderGames();
  });

  // ============================================================
  //  ЗАПУСК
  // ============================================================
  renderContacts();
  renderGames();

  if (currentChat && contacts.includes(currentChat)) {
    renderChat();
  }

  console.log('✅ MESSENGER X загружен!');
  console.log('📋 Ваш ID:', myId);
  console.log('👥 Контакты:', contacts);
  console.log('🎮 Игр:', games.length);
</script>

</body>
  </html>
