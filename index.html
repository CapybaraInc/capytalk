<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CapyTalk — Мессенджер капибар</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#1a1a2e; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Segoe UI', sans-serif; padding:20px; color:#eee; }
        .container { max-width:480px; width:100%; background:#0f0f1f; border-radius:24px; padding:20px; box-shadow:0 0 40px #ff00ff33; border:1px solid #ff00ff44; }
        .auth-screen { display:flex; flex-direction:column; gap:12px; }
        .auth-screen h1 { text-align:center; color:#ff00ff; font-size:1.8rem; text-shadow:0 0 20px #ff00ff; }
        .auth-screen .capy { text-align:center; font-size:4rem; }
        .auth-screen input { padding:10px; border-radius:10px; border:1px solid #333; background:#0a0a1a; color:#eee; outline:none; }
        .auth-screen input:focus { border-color:#ff00ff; }
        .auth-screen .btn { padding:10px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; transition:0.2s; }
        .auth-screen .btn:active { transform:scale(0.95); }
        .btn-primary { background:#ff00ff; color:#fff; }
        .btn-secondary { background:#333; color:#aaa; }
        .auth-toggle { text-align:center; color:#888; cursor:pointer; font-size:0.85rem; }
        .auth-toggle:hover { color:#ff00ff; }

        .chat-screen { display:none; flex-direction:column; height:100%; }
        .chat-header { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid #333; }
        .chat-header .user { color:#ff00ff; font-weight:bold; }
        .chat-header .logout { color:#888; cursor:pointer; font-size:0.8rem; }
        .chat-header .logout:hover { color:#ff00ff; }
        .messages { flex:1; overflow-y:auto; padding:10px 0; display:flex; flex-direction:column; gap:8px; }
        .msg { max-width:80%; padding:8px 12px; border-radius:12px; word-wrap:break-word; animation:slideIn 0.3s; }
        @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .msg.sent { align-self:flex-end; background:#ff00ff; color:#fff; box-shadow:0 0 15px #ff00ff44; }
        .msg.received { align-self:flex-start; background:#222; color:#aaa; border:1px solid #333; }
        .msg .sender { font-size:0.7rem; color:#888; margin-bottom:2px; }
        .msg .time { font-size:0.6rem; color:#666; text-align:right; margin-top:4px; }
        .input-area { display:flex; gap:8px; padding-top:10px; border-top:1px solid #333; }
        .input-area input { flex:1; padding:10px; border-radius:20px; border:1px solid #333; background:#0a0a1a; color:#eee; outline:none; }
        .input-area input:focus { border-color:#ff00ff; }
        .input-area .btn { padding:10px 16px; border-radius:20px; border:none; background:#ff00ff; color:#fff; font-weight:bold; cursor:pointer; box-shadow:0 0 15px #ff00ff44; }
        .hidden { display:none !important; }
    </style>
</head>
<body>
<div class="container">
    <!-- Экран авторизации -->
    <div class="auth-screen" id="authScreen">
        <div class="capy">🦫</div>
        <h1>CapyTalk</h1>
        <div style="text-align:center; color:#888; font-size:0.9rem; margin-bottom:10px;">Мессенджер капибар</div>

        <div id="loginForm">
            <input type="text" id="loginNick" placeholder="Никнейм (только буквы и цифры)">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn btn-primary" id="loginBtn">Войти</button>
            <span class="auth-toggle" id="showRegister">Нет аккаунта? Зарегистрируйся</span>
        </div>

        <div id="registerForm" class="hidden">
            <input type="text" id="regNick" placeholder="Никнейм (только буквы и цифры)">
            <input type="password" id="regPass" placeholder="Пароль">
            <input type="password" id="regPass2" placeholder="Повтори пароль">
            <button class="btn btn-primary" id="registerBtn">Зарегистрироваться</button>
            <span class="auth-toggle" id="showLogin">Уже есть аккаунт? Войди</span>
        </div>
    </div>

    <!-- Экран чата -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <span class="user">🦫 <span id="nickDisplay">Капибара</span></span>
            <span class="logout" id="logoutBtn">🚪 Выйти</span>
        </div>
        <div class="messages" id="messagesContainer"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Напиши что-нибудь...">
            <button class="btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
    // ===== FIREBASE CONFIG =====
    const firebaseConfig = {
        apiKey: "AIzaSyBk31qqCeb7EUD_DZD8bfaxaMYTFCqs6uk",
        authDomain: "capytalk-98aca.firebaseapp.com",
        projectId: "capytalk-98aca",
        storageBucket: "capytalk-98aca.firebasestorage.app",
        messagingSenderId: "974256232769",
        appId: "1:974256232769:web:704d19f0acbf0d198829c0",
        measurementId: "G-JLG7S1Y6ZN",
        databaseURL: "https://capytalk-98aca-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // ===== DOM =====
    const authScreen = document.getElementById('authScreen');
    const chatScreen = document.getElementById('chatScreen');
    const loginNick = document.getElementById('loginNick');
    const loginPass = document.getElementById('loginPass');
    const regNick = document.getElementById('regNick');
    const regPass = document.getElementById('regPass');
    const regPass2 = document.getElementById('regPass2');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');
    const nickDisplay = document.getElementById('nickDisplay');
    const logoutBtn = document.getElementById('logoutBtn');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesContainer = document.getElementById('messagesContainer');

    let currentUser = null;
    let nickname = '';
    let lastMessageTime = 0;

    // ===== УВЕДОМЛЕНИЯ =====
    function requestNotificationPermission() {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'granted') return;
        if (Notification.permission !== 'denied') {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    console.log('✅ Уведомления разрешены');
                }
            });
        }
    }

    function showNotification(title, body) {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'granted') {
            new Notification(title, { body: body, icon: '🦫' });
        } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    new Notification(title, { body: body, icon: '🦫' });
                }
            });
        }
    }

    // ===== АВТОРИЗАЦИЯ =====
    function toggleAuth() {
        const login = document.getElementById('loginForm');
        const register = document.getElementById('registerForm');
        login.classList.toggle('hidden');
        register.classList.toggle('hidden');
    }

    showRegister.addEventListener('click', toggleAuth);
    showLogin.addEventListener('click', toggleAuth);

    function register() {
        const nick = regNick.value.trim();
        const pass = regPass.value;
        const pass2 = regPass2.value;

        if (!nick || !pass || !pass2) {
            alert('Заполни все поля!');
            return;
        }
        if (pass !== pass2) {
            alert('Пароли не совпадают!');
            return;
        }
        if (pass.length < 6) {
            alert('Пароль не менее 6 символов!');
            return;
        }

        const email = `${nick.toLowerCase()}@capytalk.com`;
        auth.createUserWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                const user = userCredential.user;
                database.ref('users/' + user.uid).set({
                    nickname: nick,
                    email: email,
                    createdAt: Date.now()
                });
                alert('✅ Аккаунт создан! Теперь войди.');
                toggleAuth();
                loginNick.value = nick;
            })
            .catch((error) => {
                alert('❌ Ошибка: ' + error.message);
            });
    }

    function login() {
        const nick = loginNick.value.trim();
        const pass = loginPass.value;

        if (!nick || !pass) {
            alert('Заполни все поля!');
            return;
        }

        const email = `${nick.toLowerCase()}@capytalk.com`;
        auth.signInWithEmailAndPassword(email, pass)
            .then(() => {})
            .catch((error) => {
                alert('❌ Ошибка: ' + error.message);
            });
    }

    registerBtn.addEventListener('click', register);
    loginBtn.addEventListener('click', login);

    // ===== СЛЕЖЕНИЕ ЗА СОСТОЯНИЕМ ВХОДА =====
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            requestNotificationPermission();
            database.ref('users/' + user.uid).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && data.nickname) {
                    nickname = data.nickname;
                    nickDisplay.textContent = nickname;
                } else {
                    nickname = 'Капибара';
                    nickDisplay.textContent = nickname;
                }
                authScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                loadMessages();
            });
        } else {
            currentUser = null;
            nickname = '';
            authScreen.classList.remove('hidden');
            chatScreen.classList.add('hidden');
        }
    });

    // ===== ВЫХОД =====
    logoutBtn.addEventListener('click', () => {
        auth.signOut();
    });

    // ===== ОТПРАВКА СООБЩЕНИЯ =====
    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !currentUser) return;

        const messagesRef = database.ref('messages');
        messagesRef.push({
            text: text,
            sender: nickname,
            userId: currentUser.uid,
            timestamp: Date.now()
        });
        msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // ===== ЗАГРУЗКА СООБЩЕНИЙ =====
    function loadMessages() {
        const messagesRef = database.ref('messages');
        messagesRef.orderByChild('timestamp').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                messagesContainer.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">Пока нет сообщений</div>';
                return;
            }
            const messages = Object.values(data);
            messagesContainer.innerHTML = '';
            messages.forEach((msg) => {
                const div = document.createElement('div');
                div.className = 'msg ' + (msg.sender === nickname ? 'sent' : 'received');
                div.innerHTML = `
                    <div class="sender">${msg.sender}</div>
                    ${msg.text}
                    <div class="time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                `;
                messagesContainer.appendChild(div);
                // Уведомление о новом сообщении (только если оно от другого)
                if (msg.sender !== nickname && msg.timestamp > lastMessageTime) {
                    showNotification('CapyTalk', `${msg.sender}: ${msg.text.substring(0, 50)}...`);
                    lastMessageTime = msg.timestamp;
                }
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    }
</script>
</body>
</html>
