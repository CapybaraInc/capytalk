<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MESSENGER X — Игры и чат</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0D1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 450px;
      height: 780px;
      background: #0D1117;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
    }

    /* ШАПКА */
    .header {
      background: #161B22;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .logo {
      color: #E6EDF3;
      font-size: 18px;
      font-weight: 700;
    }

    .logo span {
      color: #2EA043;
    }

    .header-actions {
      color: #8B949E;
      font-size: 18px;
      display: flex;
      gap: 14px;
      cursor: pointer;
    }

    /* НАВИГАЦИЯ (вкладки) */
    .tabs {
      display: flex;
      background: #0D1117;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      color: #8B949E;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
    }

    .tab:hover {
      color: #E6EDF3;
    }

    .tab.active {
      color: #2EA043;
      border-bottom-color: #2EA043;
    }

    /* КОНТЕНТ ВКЛАДОК */
    .tab-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-pane {
      display: none;
      height: 100%;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }

    .tab-pane.active {
      display: flex;
    }

    /* === ЧАТ === */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 0;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #1F2937;
      border-radius: 4px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    .msg.friend {
      background: #1F2937;
      color: #E6EDF3;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.me {
      background: #238636;
      color: #E6EDF3;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      flex-shrink: 0;
    }

    .chat-input input {
      flex: 1;
      background: #161B22;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      color: #E6EDF3;
      font-size: 14px;
      outline: none;
    }

    .chat-input button {
      background: #2EA043;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    /* === ИГРЫ (МАГАЗИН) === */
    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 4px 0;
    }

    .game-card {
      background: #161B22;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .game-card:hover {
      border-color: #2EA043;
      transform: scale(1.02);
    }

    .game-card .icon {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .game-card .name {
      color: #E6EDF3;
      font-size: 13px;
      font-weight: 600;
    }

    .game-card .author {
      color: #8B949E;
      font-size: 11px;
    }

    .add-game-btn {
      background: #161B22;
      border: 2px dashed #2EA043;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #2EA043;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      grid-column: 1 / -1;
    }

    .add-game-btn:hover {
      background: #1F2937;
    }

    /* === КОНСОЛЬ РАЗРАБОТЧИКА === */
    .console-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .console-editor textarea {
      flex: 1;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 12px;
      padding: 12px;
      color: #E6EDF3;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 200px;
    }

    .console-editor textarea::placeholder {
      color: #8B949E;
    }

    .console-actions {
      display: flex;
      gap: 10px;
    }

    .console-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-run {
      background: #2EA043;
      color: #fff;
    }

    .btn-run:hover {
      background: #3FB950;
    }

    .btn-publish {
      background: #1F6FEB;
      color: #fff;
    }

    .btn-publish:hover {
      background: #388BFD;
    }

    .console-output {
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 12px;
      padding: 10px;
      color: #8B949E;
      font-size: 13px;
      min-height: 60px;
      max-height: 120px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
    }

    /* ИГРОВОЙ ПЛЕЕР (поверх всего) */
    .game-player {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0D1117;
      z-index: 100;
      flex-direction: column;
      padding: 16px;
    }

    .game-player.active {
      display: flex;
    }

    .game-player .close-btn {
      align-self: flex-end;
      background: #DA3633;
      border: none;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .game-player .game-frame {
      flex: 1;
      background: #0D1117;
      border: 1px solid #1F2937;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8B949E;
      font-size: 16px;
      overflow: hidden;
    }

    .game-player .game-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- ШАПКА -->
  <div class="header">
    <div class="logo">MESSENGER <span>X</span></div>
    <div class="header-actions">
      <span>🔔</span>
      <span>⚙️</span>
    </div>
  </div>

  <!-- ВКЛАДКИ -->
  <div class="tabs">
    <div class="tab active" data-tab="chat" onclick="switchTab('chat')">💬 Чат</div>
    <div class="tab" data-tab="games" onclick="switchTab('games')">🎮 Игры</div>
    <div class="tab" data-tab="console" onclick="switchTab('console')">🛠️ Консоль</div>
  </div>

  <!-- КОНТЕНТ -->
  <div class="tab-content">
    
    <!-- ВКЛАДКА ЧАТ -->
    <div class="tab-pane active" id="tab-chat">
      <div class="chat-messages" id="chatMessages">
        <div class="msg friend">Привет! Зацени новый мессенджер! 🔥</div>
        <div class="msg me">Ого! Тут можно игры создавать?</div>
        <div class="msg friend">Да! Перейди во вкладку "Игры" 😎</div>
      </div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()">➤</button>
      </div>
    </div>

    <!-- ВКЛАДКА ИГРЫ -->
    <div class="tab-pane" id="tab-games">
      <div class="games-grid" id="gamesGrid">
        <!-- Игры будут добавляться сюда -->
        <div class="game-card" onclick="playGame('Кликер', 'Кликни 100 раз!')">
          <div class="icon">🖱️</div>
          <div class="name">Кликер</div>
          <div class="author">от System</div>
        </div>
        <div class="game-card" onclick="playGame('Угадай число', 'Угадай число от 1 до 10')">
          <div class="icon">🎯</div>
          <div class="name">Угадай число</div>
          <div class="author">от System</div>
        </div>
        <div class="game-card" onclick="playGame('Викторина', 'Ответь на 5 вопросов')">
          <div class="icon">🧠</div>
          <div class="name">Викторина</div>
          <div class="author">от System</div>
        </div>
        <div class="add-game-btn" onclick="switchTab('console')">➕ Добавить свою игру</div>
      </div>
    </div>

    <!-- ВКЛАДКА КОНСОЛЬ -->
    <div class="tab-pane" id="tab-console">
      <div class="console-editor">
        <textarea id="codeEditor" placeholder="// Напиши свою игру на JavaScript&#10;// Например:&#10;function startGame() {&#10;  alert('Привет, игрок!');&#10;}">// Напиши свою игру здесь
function startGame() {
  alert('🎮 Привет! Это твоя игра!');
}</textarea>
        <div class="console-actions">
          <button class="btn-run" onclick="runGame()">▶️ Запустить</button>
          <button class="btn-publish" onclick="publishGame()">📤 Опубликовать</button>
        </div>
        <div class="console-output" id="consoleOutput">✅ Готов к работе. Напиши код и нажми "Запустить"</div>
      </div>
    </div>
  </div>

  <!-- ИГРОВОЙ ПЛЕЕР -->
  <div class="game-player" id="gamePlayer">
    <button class="close-btn" onclick="closeGame()">✕ Закрыть игру</button>
    <div class="game-frame" id="gameFrame">
      <span id="gamePlaceholder">🎮 Загрузка игры...</span>
    </div>
  </div>
</div>

<script>
  // === ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ===
  function switchTab(tabName) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    document.getElementById('tab-' + tabName).classList.add('active');
    document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
  }

  // === ОТПРАВКА СООБЩЕНИЙ ===
  function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    const container = document.getElementById('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'msg me';
    msg.textContent = text;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    input.value = '';

    // Имитация ответа друга
    setTimeout(() => {
      const replies = ['Круто! 😎', 'Понял!', 'Ого!', '🔥🔥🔥', 'А давай поиграем?'];
      const reply = document.createElement('div');
      reply.className = 'msg friend';
      reply.textContent = replies[Math.floor(Math.random() * replies.length)];
      container.appendChild(reply);
      container.scrollTop = container.scrollHeight;
    }, 800);
  }

  // === ЗАПУСК ИГРЫ ИЗ МАГАЗИНА ===
  function playGame(name, desc) {
    const player = document.getElementById('gamePlayer');
    const frame = document.getElementById('gameFrame');
    const placeholder = document.getElementById('gamePlaceholder');
    
    player.classList.add('active');
    placeholder.textContent = `🎮 ${name}\n${desc}\n\n(Здесь будет твоя игра!)`;
    
    // Если есть сохранённая игра — запускаем её
    const savedGame = localStorage.getItem('publishedGame');
    if (savedGame) {
      try {
        const fn = new Function(savedGame);
        fn();
      } catch(e) {
        placeholder.textContent = '❌ Ошибка в игре: ' + e.message;
      }
    }
  }

  function closeGame() {
    document.getElementById('gamePlayer').classList.remove('active');
  }

  // === КОНСОЛЬ РАЗРАБОТЧИКА ===
  let publishedGames = JSON.parse(localStorage.getItem('games') || '[]');

  function runGame() {
    const code = document.getElementById('codeEditor').value;
    const output = document.getElementById('consoleOutput');
    
    try {
      // Очищаем предыдущие результаты
      const frame = document.getElementById('gameFrame');
      const placeholder = document.getElementById('gamePlaceholder');
      
      // Создаём функцию из кода
      const gameFn = new Function(code + '\n return startGame;');
      const startGame = gameFn();
      
      // Запускаем игру в песочнице
      const originalAlert = window.alert;
      let logs = [];
      window.alert = function(msg) {
        logs.push('🟢 ' + msg);
        output.innerHTML = logs.join('\n');
      };
      
      startGame();
      
      window.alert = originalAlert;
      output.innerHTML += '\n✅ Игра выполнена!';
      
      // Сохраняем игру локально
      localStorage.setItem('currentGame', code);
      
    } catch(e) {
      output.innerHTML = '❌ Ошибка: ' + e.message;
    }
  }

  function publishGame() {
    const code = document.getElementById('codeEditor').value;
    const output = document.getElementById('consoleOutput');
    
    if (!code.trim()) {
      output.innerHTML = '❌ Напиши код игры!';
      return;
    }

    // Проверяем, что есть функция startGame
    if (!code.includes('function startGame')) {
      output.innerHTML = '❌ Добавь функцию startGame() в свой код!';
      return;
    }

    // Сохраняем игру
    const games = JSON.parse(localStorage.getItem('games') || '[]');
    const gameData = {
      id: Date.now(),
      name: 'Новая игра ' + (games.length + 1),
      author: 'Разработчик',
      code: code,
      icon: '🎮'
    };
    
    games.push(gameData);
    localStorage.setItem('games', JSON.stringify(games));
    
    output.innerHTML = '✅ Игра опубликована! Перейди во вкладку "Игры"';
    loadGames();
  }

  function loadGames() {
    const grid = document.getElementById('gamesGrid');
    const games = JSON.parse(localStorage.getItem('games') || '[]');
    
    // Удаляем старые игры (кроме системных)
    const systemGames = grid.querySelectorAll('.game-card:not(.add-game-btn)');
    systemGames.forEach(el => el.remove());
    
    // Добавляем пользовательские игры
    games.forEach(game => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <div class="icon">${game.icon || '🎮'}</div>
        <div class="name">${game.name}</div>
        <div class="author">от ${game.author}</div>
      `;
      card.onclick = () => {
        // Загружаем игру из сохранённого кода
        localStorage.setItem('publishedGame', game.code);
        playGame(game.name, 'Игра от пользователя');
      };
      grid.insertBefore(card, grid.querySelector('.add-game-btn'));
    });
  }

  // Загружаем игры при старте
  loadGames();

  // Сохраняем игру при вводе
  document.getElementById('codeEditor').addEventListener('input', function() {
    localStorage.setItem('currentGame', this.value);
  });

  // Восстанавливаем последний код
  const savedCode = localStorage.getItem('currentGame');
  if (savedCode) {
    document.getElementById('codeEditor').value = savedCode;
  }

  // Автоскролл чата
  document.addEventListener('DOMContentLoaded', function() {
    const chat = document.getElementById('chatMessages');
    chat.scrollTop = chat.scrollHeight;
  });
</script>
</body>
    </html>
